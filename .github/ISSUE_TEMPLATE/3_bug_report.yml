name: 🐛 Bug Report
description: Report a bug.
labels:
  - "Cat: Bug 🐛"
  - "Status: Needs Triage 💡"
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Choose the affected package or repository tooling.
      options:
        - eslint-config
        - lighthouse-config
        - nilay-about
        - nilay-knowledge
        - prettier-config
        - saika-director
        - saika-docs
        - saika-lane
        - saika-protocol
        - saika-rules
        - saika-updater
        - saika-vista
        - stylelint-config
        - typescript-config
        - Repository / CI / development environment
        - Multiple packages / unsure
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Environment
      description: Select the operating system where the issue occurs.
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS / iPadOS
        - Other / not platform-specific
    validations:
      required: true
    id: environment
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the affected release, package version, or commit SHA.
    validations:
      required: true
  - type: textarea
    id: runtime
    attributes:
      label: Runtime and device details
      description: >-
        For websites, include browser and version. For desktop apps, include OS version and relevant
        target/device model. For tooling, include Node.js and npm versions.
  - type: textarea
    attributes:
      label: Description
      description: Clearly describe the issue. Include the current behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Provide detailed steps so that others can easily reproduce the issue.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Suggested Solution
      description: "Optional: If you have identified the cause or a potential fix, please describe it."
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: >-
        Optional: Attach relevant logs or screenshots after removing passwords, tokens, and personal
        information.
