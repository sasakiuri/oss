name: "Setup Node.js Environment"
description: "Setup Node.js, install dependencies, and optionally configure caches"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "24.16.0"
  enable-turbo-cache:
    description: "Enable Turborepo cache"
    required: false
    default: "false"
  enable-electron-cache:
    description: "Enable Electron binary cache"
    required: false
    default: "false"
  registry-url:
    description: "npm registry URL (for publish workflows)"
    required: false
    default: ""
  prepare-windows-browser-deps:
    description: "Provision Windows browser dependencies alongside npm ci"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        registry-url: ${{ inputs.registry-url }}

    - name: Cache Turborepo
      if: inputs.enable-turbo-cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json', 'packages/*/package.json') }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json', 'packages/*/package.json') }}-${{ github.job }}-
          turbo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json', 'packages/*/package.json') }}-
          turbo-${{ runner.os }}-

    - name: Cache Electron binaries
      if: inputs.enable-electron-cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/electron
          ~/Library/Caches/electron
          ~/AppData/Local/electron/Cache
        key: electron-${{ runner.os }}-${{ hashFiles('packages/saika-lane/package.json', 'packages/saika-director/package.json') }}
        restore-keys: electron-${{ runner.os }}-

    # Bootstrap the exact package manager before installing the lockfile.
    - name: Pin npm
      run: | # zizmor: ignore[adhoc-packages]
        if [ "$(npm --version)" != "11.13.0" ]; then
          npm install --global npm@11.13.0
        fi
        test "$(npm --version)" = "11.13.0"
      shell: bash

    - name: Install dependencies
      if: inputs.prepare-windows-browser-deps != 'true'
      run: npm ci
      shell: bash

    - name: Verify concurrent setup behavior
      if: inputs.prepare-windows-browser-deps == 'true'
      run: node --test scripts/install-ci-dependencies.test.mjs scripts/install-windows-browser-deps.test.mjs
      shell: bash

    - name: Install dependencies and Windows browser prerequisites
      if: inputs.prepare-windows-browser-deps == 'true'
      run: npm run ci:install -- --windows-browser-deps
      shell: bash
