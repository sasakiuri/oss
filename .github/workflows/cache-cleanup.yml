name: Cache Cleanup

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Closed pull request number whose caches should be removed
        type: number
        required: true

permissions: {}

jobs:
  approval:
    runs-on: ubuntu-latest
    permissions: {}
    environment: ci-approval
    steps:
      - name: Confirm approval
        run: "true"

  cleanup:
    needs: approval
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup caches for closed PR
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid PR number"; exit 1; }
          BRANCH="refs/pull/$PR_NUMBER/merge"
          echo "Fetching list of cache keys for PR #$PR_NUMBER"
          CACHE_KEYS=$(gh actions-cache list -R "$REPO" -B "$BRANCH" --limit 100 | cut -f 1)

          if [ -z "$CACHE_KEYS" ]; then
            echo "No caches found"
            exit 0
          fi

          echo "Deleting caches..."
          for KEY in $CACHE_KEYS; do
            gh actions-cache delete "$KEY" -R "$REPO" -B "$BRANCH" --confirm || true
          done
          echo "Done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
