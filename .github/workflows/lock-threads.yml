name: Lock Threads

on:
  workflow_call:
    inputs:
      approval-inherited:
        description: The caller gates this run with ci-approval.
        type: boolean
        default: true
  workflow_dispatch:

# Only the workload inherits these permissions; approval explicitly grants none.
permissions:
  issues: write # zizmor: ignore[excessive-permissions]
  pull-requests: write # zizmor: ignore[excessive-permissions]

jobs:
  approval:
    if: ${{ !inputs.approval-inherited }}
    runs-on: ubuntu-latest
    permissions: {}
    environment: ci-approval
    steps:
      - name: Confirm approval
        run: "true"

  lock:
    needs: approval
    if: ${{ !cancelled() && (needs.approval.result == 'success' || (inputs.approval-inherited && needs.approval.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          issue-inactive-days: 30
          pr-inactive-days: 30
          issue-lock-reason: resolved
          pr-lock-reason: resolved
          log-output: true
