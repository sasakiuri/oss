name: Knowledge verification workspace

# Temporary, isolated verification branch. This workflow is not proposed for 1.x.
on:
  push:
    branches:
      - chore/nilay-knowledge/verification-workspace
    paths:
      - .github/workflows/knowledge-verification-workspace.yml

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: knowledge-verification-workspace
          run-id: 36553252984
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verification
      - name: Split only the dependency archive below the connector size limit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/verification"
          sha256sum --check SHA256SUMS
          split -b 400M dependencies.tar.gz dependencies.part-
          test -f dependencies.part-aa
          test -f dependencies.part-ab
          test -f dependencies.part-ac
          test ! -f dependencies.part-ad
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-verification-source-runtime
          path: |
            ${{ runner.temp }}/verification/source.tar.gz
            ${{ runner.temp }}/verification/runtime.tar.gz
            ${{ runner.temp }}/verification/versions.txt
            ${{ runner.temp }}/verification/SHA256SUMS
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-verification-deps-aa
          path: ${{ runner.temp }}/verification/dependencies.part-aa
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-verification-deps-ab
          path: ${{ runner.temp }}/verification/dependencies.part-ab
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-verification-deps-ac
          path: ${{ runner.temp }}/verification/dependencies.part-ac
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
