# SPDX-License-Identifier: MIT
name: Version

on:
  push:
    branches: [1.x]

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Husky's commit-msg/pre-commit hooks run commitlint against fixed strings
      # like "Version Packages" which are not Conventional Commits. Disable husky
      # hooks in CI — they exist to guard developer commits, not automated flows.
      HUSKY: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-node

      - name: Create release PR or version bump
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          version: npx changeset version
          commit: "chore(saika-lane): version packages"
          title: "chore(saika-lane): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push version tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./packages/saika-lane/package.json').version")
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
          fi
