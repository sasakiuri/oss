# SPDX-License-Identifier: MIT
name: Version

on:
  push:
    branches: [1.x]

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Husky's commit-msg/pre-commit hooks run commitlint against fixed strings
      # like "Version Packages" which are not Conventional Commits. Disable husky
      # hooks in CI — they exist to guard developer commits, not automated flows.
      HUSKY: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-node

      - name: Create release PR or version bump
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: npx changeset version
          commit: "chore(repo): version saika suite"
          title: "chore(repo): version saika suite"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push version tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          lane_version=$(node -p "require('./packages/saika-lane/package.json').version")
          director_version=$(node -p "require('./packages/saika-director/package.json').version")
          docs_version=$(node -p "require('./packages/saika-docs/package.json').version")
          vista_version=$(node -p "require('./packages/saika-vista/package.json').version")
          if [ "$lane_version" != "$director_version" ] || [ "$lane_version" != "$docs_version" ] || [ "$lane_version" != "$vista_version" ]; then
            echo "::error::Saika suite versions must match: Lane ($lane_version), Director ($director_version), Docs ($docs_version), Vista ($vista_version)"
            exit 1
          fi
          TAG="v${lane_version}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
          fi
