name: Canary Release

on:
  push:
    branches: [canary]

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "true"
          enable-electron-cache: "true"

      - name: Verify Saika suite versions match
        run: |
          lane_version=$(node -p "require('./packages/saika-lane/package.json').version")
          director_version=$(node -p "require('./packages/saika-director/package.json').version")
          docs_version=$(node -p "require('./packages/saika-docs/package.json').version")
          vista_version=$(node -p "require('./packages/saika-vista/package.json').version")
          if [ "$lane_version" != "$director_version" ] || [ "$lane_version" != "$docs_version" ] || [ "$lane_version" != "$vista_version" ]; then
            echo "::error::Saika suite versions must match: Lane ($lane_version), Director ($director_version), Docs ($docs_version), Vista ($vista_version)"
            exit 1
          fi

      - name: Rebuild better-sqlite3 for Node.js tests
        run: npm rebuild better-sqlite3

      - name: Type check
        run: npx turbo typecheck

      - name: Lint
        run: npx turbo lint

      - name: Test applications
        run: |
          npm run test --workspace=@sasakiuri/saika-lane
          npm run test --workspace=@sasakiuri/saika-director
          npm run test --workspace=@sasakiuri/saika-vista

      - name: Verify third-party license reports
        run: npm run license-report:check

  build:
    name: Build (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          enable-electron-cache: "true"

      - name: Build Saika Lane artifacts
        run: npm run build:${{ matrix.platform }} --workspace=@sasakiuri/saika-lane
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build Saika Director artifacts
        run: npm run build:${{ matrix.platform }} --workspace=@sasakiuri/saika-director
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build Saika Vista artifacts
        run: npm run build:${{ matrix.platform }} --workspace=@sasakiuri/saika-vista
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged legal notices
        run: |
          npm run license-artifacts:check --workspace=@sasakiuri/saika-lane
          npm run license-artifacts:check --workspace=@sasakiuri/saika-director
          npm run license-artifacts:check --workspace=@sasakiuri/saika-vista

      - name: Upload Saika Lane build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-lane-${{ matrix.os }}
          path: |
            packages/saika-lane/release/*.exe
            packages/saika-lane/release/*.zip
            packages/saika-lane/release/*.dmg
            packages/saika-lane/release/*.AppImage
            packages/saika-lane/release/*.deb
            packages/saika-lane/release/latest*.yml
            packages/saika-lane/release/*.blockmap
          if-no-files-found: error
          retention-days: 1

      - name: Upload Saika Director build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-director-${{ matrix.os }}
          path: |
            packages/saika-director/release/*.exe
            packages/saika-director/release/*.zip
            packages/saika-director/release/*.dmg
            packages/saika-director/release/*.AppImage
            packages/saika-director/release/*.deb
          if-no-files-found: error
          retention-days: 1

      - name: Upload Saika Vista build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-vista-${{ matrix.os }}
          path: |
            packages/saika-vista/release/*.exe
            packages/saika-vista/release/*.zip
            packages/saika-vista/release/*.dmg
            packages/saika-vista/release/*.AppImage
            packages/saika-vista/release/*.deb
          if-no-files-found: error
          retention-days: 1

  create-release:
    name: Publish Canary Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Determine canary version tag
        id: version
        run: |
          lane_version=$(node -p "require('./packages/saika-lane/package.json').version")
          director_version=$(node -p "require('./packages/saika-director/package.json').version")
          docs_version=$(node -p "require('./packages/saika-docs/package.json').version")
          vista_version=$(node -p "require('./packages/saika-vista/package.json').version")
          if [ "$lane_version" != "$director_version" ] || [ "$lane_version" != "$docs_version" ] || [ "$lane_version" != "$vista_version" ]; then
            echo "Saika suite versions do not match: Lane ($lane_version), Director ($director_version), Docs ($docs_version), Vista ($vista_version)" >&2
            exit 1
          fi
          short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=v${lane_version}-canary.${short_sha}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Download Saika Lane artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/lane
          pattern: canary-lane-*
          merge-multiple: true

      - name: Download Saika Director artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/director
          pattern: canary-director-*
          merge-multiple: true

      - name: Download Saika Vista artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/vista
          pattern: canary-vista-*
          merge-multiple: true

      - name: Restore execute permissions on AppImages
        run: chmod +x artifacts/lane/*.AppImage artifacts/director/*.AppImage artifacts/vista/*.AppImage 2>/dev/null || true
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/lane/*.exe
            artifacts/lane/*.zip
            artifacts/lane/*.dmg
            artifacts/lane/*.AppImage
            artifacts/lane/*.deb
            artifacts/lane/latest*.yml
            artifacts/lane/*.blockmap
            artifacts/director/*.exe
            artifacts/vista/*.exe
            artifacts/director/*.zip
            artifacts/vista/*.zip
            artifacts/director/*.dmg
            artifacts/vista/*.dmg
            artifacts/director/*.AppImage
            artifacts/vista/*.AppImage
            artifacts/director/*.deb
            artifacts/vista/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
