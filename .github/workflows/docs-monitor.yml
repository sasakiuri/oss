name: Docs static site monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
permissions:
  contents: read
jobs:
  monitor:
    if: vars.DOCS_MONITOR_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
      - run: node packages/saika-docs/scripts/monitor.mjs
        env:
          MONITOR_URL: ${{ vars.DOCS_MONITOR_URL }}
