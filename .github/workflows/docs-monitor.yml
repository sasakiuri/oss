name: Docs static site monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
permissions:
  contents: read
jobs:
  monitor:
    if: vars.DOCS_MONITOR_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
      - run: node packages/saika-docs/scripts/monitor.mjs
        env:
          MONITOR_URL: ${{ vars.DOCS_MONITOR_URL }}
