# cspell:words lycheeverse
name: Knowledge content links
on:
  workflow_call:
    inputs:
      approval-inherited:
        description: The caller gates this run with ci-approval.
        type: boolean
        default: true
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approval:
    if: ${{ !inputs.approval-inherited }}
    runs-on: ubuntu-24.04
    permissions: {}
    environment: ci-approval
    steps:
      - name: Confirm approval
        run: "true"

  links:
    needs: approval
    if: ${{ !cancelled() && (needs.approval.result == 'success' || (inputs.approval-inherited && needs.approval.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Prepare rendered content and local route targets
        run: npm run lint:links:prepare --workspace=@sasakiuri/nilay-knowledge
      - name: Check local links and article heading fragments
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          workingDirectory: packages/nilay-knowledge
          args: --config .cache/links/lychee.toml --files-from .cache/links/inputs.txt --offline
          output: .cache/links/internal.md
          fail: true
          failIfEmpty: true
          jobSummary: true
      - name: Verify missing route, asset and fragment detection
        run: npm run test:run --workspace=@sasakiuri/nilay-knowledge -- __tests__/scripts/link-check.test.ts
      - name: Report external link failures
        if: github.event_name != 'pull_request'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          workingDirectory: packages/nilay-knowledge
          args: --config .cache/links/lychee.toml --files-from .cache/links/inputs.txt
          output: .cache/links/external.md
          fail: false
          failIfEmpty: true
          jobSummary: true
      - name: Upload link reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-link-reports
          path: packages/nilay-knowledge/.cache/links/*.md
          if-no-files-found: ignore
          retention-days: 30
