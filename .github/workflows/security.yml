name: Security

on:
  workflow_dispatch:
  push:
    branches: [1.x]
  pull_request:
    branches: [1.x]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  approval:
    runs-on: ubuntu-latest
    permissions: {}
    environment: ci-approval
    steps:
      - name: Confirm approval
        run: "true"

  osv-scan-push:
    needs: approval
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b8ac13f90f0ad78cebdcdbe5d39fcc8ff11301ba # v2
    with:
      scan-args: |-
        --recursive
        ./

  osv-scan-pr:
    needs: approval
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@c51854704019a247608d928f370c98740469d4b5 # v2
