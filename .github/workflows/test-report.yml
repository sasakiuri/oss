name: Test Report

on:
  # Only parse JUnit data with a pinned reporter; never execute PR code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  report:
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest

    steps:
      # The reporter discovers existing artifacts from the triggering CI run.
      # Captured OS names keep separate reports without starting three runners.
      - name: Vitest test report
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2
        with:
          artifact: /^test-results-(ubuntu-latest|windows-latest|macos-latest)$/
          name: "Vitest ($1)"
          path: "**/vitest-junit.xml"
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Playwright test report
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2
        with:
          artifact: /^test-results-(ubuntu-latest|windows-latest|macos-latest)$/
          name: "Playwright ($1)"
          path: "**/playwright-junit.xml"
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
