name: Test Report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  checks: write
  actions: read

jobs:
  report:
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: test-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Vitest test report
        if: hashFiles('test-results/vitest-junit.xml') != ''
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Vitest (${{ matrix.os }})"
          path: test-results/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Playwright test report
        if: hashFiles('test-results/playwright-junit.xml') != ''
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Playwright (${{ matrix.os }})"
          path: test-results/playwright-junit.xml
          reporter: java-junit
          fail-on-error: false
