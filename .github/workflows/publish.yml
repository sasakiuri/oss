name: Publish Packages

# Publishes shared config packages using NPM_TOKEN, with OIDC build attestations.

on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/1.x'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      # Changesets (and version tags) push commits using the checkout credentials.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Build
        run: npx turbo build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v1
        with:
          publish: npx changeset publish --provenance
          version: npx changeset version
          title: "chore(root): version packages"
          commit: "chore(root): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
