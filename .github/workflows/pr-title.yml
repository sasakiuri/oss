name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            revert
          scopes: |
            saika-lane
            eslint-config
            prettier-config
            stylelint-config
            typescript-config
            repo
            root
            monorepo
          requireScope: true
          subjectPattern: ^.+$
          subjectPatternError: "PR title subject must not be empty"
