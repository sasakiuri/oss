name: PR Title

on:
  # Metadata-only validation: no checkout or execution of pull request code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            revert
          scopes: |
            saika-lane
            saika-director
            saika-vista
            saika-protocol
            saika-rules
            saika-docs
            nilay-knowledge
            nilay-about
            eslint-config
            prettier-config
            stylelint-config
            typescript-config
            repo
            root
            monorepo
          requireScope: true
          subjectPattern: ^.+$
          subjectPatternError: "PR title subject must not be empty"
