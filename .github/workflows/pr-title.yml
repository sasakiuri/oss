name: PR Title

on:
  # Only trusted base code validates untrusted title text passed through env.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read upstream npm version
        id: runtime
        run: echo "npm=$(node -p 'require("./package.json").volta.npm')" >> "$GITHUB_OUTPUT"
      - name: Install upstream package manager
        env:
          NPM_VERSION: ${{ steps.runtime.outputs.npm }}
        run: npm install --global "npm@$NPM_VERSION" # zizmor: ignore[adhoc-packages]
      - run: npm ci --ignore-scripts
      - name: Validate title with shared commitlint policy
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm exec --no -- commitlint --verbose
