name: PR Title

on:
  # Only trusted base code validates untrusted title text passed through env.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read upstream npm version
        id: runtime
        run: echo "npm=$(node -p 'require("./package.json").volta.npm')" >> "$GITHUB_OUTPUT"
      - name: Install upstream package manager
        env:
          NPM_VERSION: ${{ steps.runtime.outputs.npm }}
        run: npm install --global "npm@$NPM_VERSION" # zizmor: ignore[adhoc-packages]
      - run: npm ci --ignore-scripts
      - name: Validate title with shared commitlint policy
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm exec --no -- commitlint --verbose
