name: Docs deep quality
on:
  workflow_call:
    inputs:
      approval-inherited:
        description: The caller gates this run with ci-approval.
        type: boolean
        default: true
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approval:
    if: ${{ !inputs.approval-inherited }}
    runs-on: ubuntu-24.04
    permissions: {}
    environment: ci-approval
    steps:
      - name: Confirm approval
        run: "true"

  deterministic:
    needs: approval
    if: ${{ !cancelled() && (needs.approval.result == 'success' || (inputs.approval-inherited && needs.approval.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm run test:mutation --workspace=@sasakiuri/saika-docs
      - run: npm run test:reproducible --workspace=@sasakiuri/saika-docs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-deep-quality
          path: packages/saika-docs/reports/
