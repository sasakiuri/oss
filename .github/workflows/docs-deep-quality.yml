name: Docs deep quality
on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 0"
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm run test:mutation --workspace=@sasakiuri/saika-docs
      - run: npm run test:reproducible --workspace=@sasakiuri/saika-docs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-deep-quality
          path: packages/saika-docs/reports/
