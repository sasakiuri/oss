name: Stale Issues

on:
  workflow_call:
    inputs:
      approval-inherited:
        description: The caller gates this run with ci-approval.
        type: boolean
        default: true
  workflow_dispatch:

# Only the workload inherits these permissions; approval explicitly grants none.
permissions:
  issues: write # zizmor: ignore[excessive-permissions]
  pull-requests: write # zizmor: ignore[excessive-permissions]

jobs:
  approval:
    if: ${{ !inputs.approval-inherited }}
    runs-on: ubuntu-latest
    permissions: {}
    environment: ci-approval
    steps:
      - name: Confirm approval
        run: "true"

  stale:
    needs: approval
    if: ${{ !cancelled() && (needs.approval.result == 'success' || (inputs.approval-inherited && needs.approval.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs."
          stale-pr-message: "This pull request has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs."
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "Status: Stale"
          stale-pr-label: "Status: Stale"
          exempt-issue-labels: "Status: Pinned,help wanted"
          exempt-pr-labels: "Status: Pinned"
