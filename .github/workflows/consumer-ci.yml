name: Companion repository quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout consumer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          path: consumer
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Checkout shared tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          repository: sasakiuri/oss
          ref: 1.x
          path: oss
      - name: Read upstream runtime
        id: runtime
        working-directory: oss
        run: |
          echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          echo "npm=$(node -p 'require("./package.json").volta.npm')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Install upstream package manager
        uses: ./oss/.github/actions/setup-npm
      # With lifecycle scripts disabled, the same lockfile and runtime reproduce
      # the installed tree, including workspace-local node_modules.
      - name: Cache upstream tools
        id: upstream-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            oss/node_modules
            oss/packages/*/node_modules
          key: consumer-ci-tools-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.runtime.outputs.node }}-npm-${{ steps.runtime.outputs.npm }}-${{ hashFiles('oss/package-lock.json') }}
      - name: Install upstream tools
        working-directory: oss
        env:
          CACHE_HIT: ${{ steps.upstream-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ] &&
            test -f node_modules/.package-lock.json &&
            node packages/repo-tooling/cli.mjs run eslint --version; then
            echo "Using cached upstream tools"
          else
            npm ci --ignore-scripts
          fi
      - name: Install consumer dependencies
        working-directory: consumer
        run: node ../oss/packages/repo-tooling/cli.mjs install --ci
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        working-directory: consumer
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm exec -- repo-tooling run commitlint --verbose
      - name: Infrastructure lint
        working-directory: consumer
        run: npm run lint:infra
      - name: Quality assurance
        working-directory: consumer
        run: npm run qa
      - name: Changed executable line coverage
        if: github.event_name == 'pull_request'
        working-directory: consumer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run coverage:diff -- --base "$BASE_SHA"
