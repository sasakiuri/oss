name: CI
# Temporary verification only: run the unchanged #134 source across all platforms.
# This draft verification branch must not be merged.

on:
  push:
    branches: [1.x]
  pull_request:
    branches: [1.x, canary]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      text: ${{ steps.plan.outputs.text }}
      infrastructure: ${{ steps.plan.outputs.infrastructure }}
      ci: ${{ steps.plan.outputs.ci }}
      build: ${{ steps.plan.outputs.build }}
      docs: ${{ steps.plan.outputs.docs }}
      electron: ${{ steps.plan.outputs.electron }}
      knowledge: ${{ steps.plan.outputs.knowledge }}
      e2e: ${{ steps.plan.outputs.e2e }}
      e2eMatrix: ${{ steps.plan.outputs.e2eMatrix }}
      packages: ${{ steps.plan.outputs.packages }}
      os: ${{ steps.plan.outputs.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify CI selection and gate behavior
        run: node --test scripts/select-ci-packages.test.mjs scripts/run-package-ci.test.mjs scripts/check-required-ci.test.mjs scripts/install-ci-dependencies.test.mjs scripts/install-windows-browser-deps.test.mjs
      - name: Select affected packages and runners
        id: plan
        run: node scripts/select-ci-packages.mjs

  text:
    name: Text lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.text == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup-node
      - name: Verify text spacing rules
        run: npm run test:text
      - name: Verify release checks
        run: npm run test:pre-release
      - name: Verify dependency update policy
        run: node --test scripts/dependabot-policy.test.mjs
      - name: Lint documentation
        run: npm run lint:text

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Lint workflows, shell scripts, Dockerfiles, and Actions security
        run: node scripts/lint-infra.mjs

  lint:
    env:
      CI_PACKAGES_JSON: ${{ needs.changes.outputs.packages }}
    name: Lint & Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "true"

      - name: Type check
        run: npm run ci:packages -- typecheck

      - name: Test changed-code coverage gate
        run: node --test scripts/coverage-diff-check.test.mjs

      - name: Lint
        run: npm run ci:packages -- lint

      - name: Architecture validation
        run: npm run ci:packages -- depcruise

      # Validates dependency license compatibility against allowed SPDX list
      # in .licensee.json. Does not perform deep transitive-dependency analysis
      # beyond what npm installs (i.e., optional/peer deps not installed are not checked).
      - name: License check
        run: npm run license-check

      - name: Verify third-party license report
        run: npm run license-report:check

      - name: Spell check
        run: npm run cspell

      - name: Unused exports check
        run: npm run ci:packages -- knip

      - name: Dependency version check
        run: npm run syncpack

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI_PACKAGES_JSON: ${{ needs.changes.outputs.packages }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "true"
          enable-electron-cache: "true"
      - name: Build affected packages
        run: npm run ci:packages -- build
      - name: Archive build outputs with their permissions
        shell: bash
        run: |
          shopt -s nullglob
          outputs=(packages/*/dist packages/*/build packages/*/.next packages/*/lib/generated packages/*/public/feed.xml packages/*/public/sitemap.xml packages/*/public/content-styles)
          # An empty file list also supports workspaces with type-check-only builds.
          touch build-output-files.txt
          tar -cf build-output.tar --exclude='*/.next/cache' --exclude='*/.next/standalone' --exclude='*/.next/dev' -T build-output-files.txt "${outputs[@]}"
      - name: Share build outputs with independent checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.os }}
          path: build-output.tar
          compression-level: 1
          if-no-files-found: error
          retention-days: 1
      - name: Bundle size check
        run: npm run ci:packages -- size-limit

  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes, build]
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI_PACKAGES_JSON: ${{ needs.changes.outputs.packages }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          enable-electron-cache: "true"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-${{ matrix.os }}
      - name: Restore build outputs
        shell: bash
        run: tar -xf build-output.tar
      - name: Rebuild better-sqlite3 for Node.js tests
        if: needs.changes.outputs.electron == 'true'
        run: npm rebuild better-sqlite3
      - name: Test with coverage (Linux)
        if: runner.os == 'Linux'
        run: npm run ci:packages -- test
      - name: Test without duplicate coverage (other platforms)
        if: runner.os != 'Linux'
        run: npm run ci:packages -- test --without-coverage
      - name: Require coverage of changed code
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run coverage:diff -- --base "$BASE_SHA" --packages "$CI_PACKAGES_JSON"
      - name: Mutation test affected core libraries
        if: runner.os == 'Linux'
        run: npm run ci:packages -- test:mutation
      - name: Test release metadata
        if: contains(fromJSON(needs.changes.outputs.packages), '@sasakiuri/saika-updater')
        run: npm run test:release-metadata
      - name: Upload unit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            packages/*/coverage/
            packages/*/test-results/vitest-junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Saika Lane coverage
        if: runner.os == 'Linux' && contains(fromJSON(needs.changes.outputs.packages), '@sasakiuri/saika-lane')
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5
        with:
          directory: packages/saika-lane/coverage
          flags: saika-lane
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload Saika Director coverage
        if: runner.os == 'Linux' && contains(fromJSON(needs.changes.outputs.packages), '@sasakiuri/saika-director')
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5
        with:
          directory: packages/saika-director/coverage
          flags: saika-director
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E (${{ matrix.package }}, ${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    needs: [changes, build]
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.e2eMatrix) }}
    env:
      CI_PACKAGES_JSON: ${{ format('["{0}"]', matrix.package) }}
      E2E_PACKAGE: ${{ matrix.package }}
      E2E_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          enable-electron-cache: ${{ matrix.electron && 'true' || 'false' }}
          prepare-windows-browser-deps: ${{ runner.os == 'Windows' && matrix.package == '@sasakiuri/nilay-knowledge' && 'true' || 'false' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-${{ matrix.os }}
      - name: Restore build outputs
        shell: bash
        run: tar -xf build-output.tar
      # npm ci has already rebuilt native modules for Electron in this fresh job.
      - name: Install browser dependencies
        if: matrix.installBrowsers
        shell: bash
        run: npm run test:install --workspace="$E2E_PACKAGE"
      - name: E2E tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run ci:packages -- test:e2e --shard "$E2E_SHARD"
      - name: E2E tests (other platforms)
        if: runner.os != 'Linux'
        shell: bash
        run: npm run ci:packages -- test:e2e --shard "$E2E_SHARD"
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-${{ strategy.job-index }}-${{ matrix.os }}
          path: |
            ${{ matrix.directory }}/playwright-report/
            ${{ matrix.directory }}/test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Knowledge Lighthouse
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.knowledge == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-ubuntu-latest
      - name: Restore build outputs
        run: tar -xf build-output.tar
      - name: Install Chromium for Lighthouse
        run: npm exec --workspace=@sasakiuri/nilay-knowledge -- playwright install --with-deps chromium
      - name: Lighthouse and asset regression checks
        run: |
          npm run test:lighthouse --workspace=@sasakiuri/nilay-knowledge
          npm run test:content-styles --workspace=@sasakiuri/nilay-knowledge
          npm run test:size-budget --workspace=@sasakiuri/nilay-knowledge
          npm run test:deployment-smoke --workspace=@sasakiuri/nilay-knowledge
          npm run lhci:run --workspace=@sasakiuri/nilay-knowledge
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nilay-knowledge-lighthouse
          path: packages/nilay-knowledge/.lighthouse.reports/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    permissions:
      contents: read

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    needs:
      [changes, text, infrastructure, lint, build, unit, e2e, lighthouse, docs]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Verify gate behavior
        run: node --test scripts/check-required-ci.test.mjs
      - name: Require successful applicable checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/check-required-ci.mjs
