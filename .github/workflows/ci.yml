name: CI

on:
  push:
    branches: [1.x]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/SUPPORT.md"
      - ".github/FUNDING.yml"
      - ".github/labels.yml"
      - "LICENSE"
      - ".editorconfig"
  pull_request:
    branches: [1.x, canary]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # paths-filter needs full history for push-event diff computation
          # (shallow clones miss the base commit when several commits are
          # pushed together). PR events use base.sha so depth is irrelevant.
          fetch-depth: 0
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          predicate-quantifier: "every"
          filters: |
            ci:
              - '**'
              - '!**.md'
              - '!docs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/DISCUSSION_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
              - '!.github/SUPPORT.md'
              - '!.github/FUNDING.yml'
              - '!.github/labels.yml'
              - '!LICENSE'
              - '!.editorconfig'

  lint:
    name: Lint & Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "true"

      - name: Type check
        run: cd packages/saika-lane && npx tsc --noEmit

      - name: Lint
        run: npx turbo lint

      - name: Architecture validation
        run: npx turbo depcruise

      # Validates dependency license compatibility against allowed SPDX list
      # in .licensee.json. Does not perform deep transitive-dependency analysis
      # beyond what npm installs (i.e., optional/peer deps not installed are not checked).
      - name: License check
        run: npm run license-check

      - name: Verify third-party license report
        run: npm run license-report:check

      - name: Spell check
        run: npm run cspell

      - name: Unused exports check
        run: npm run knip

      - name: Dependency version check
        run: npm run syncpack

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "true"
          enable-electron-cache: "true"

      - name: Build
        run: npx turbo build

      - name: Rebuild better-sqlite3 for Node.js (test)
        run: cd packages/saika-lane && npm rebuild better-sqlite3

      - name: Test
        run: cd packages/saika-lane && npx vitest run --coverage

      - name: Rebuild native modules for Electron (E2E)
        run: cd packages/saika-lane && npx electron-rebuild -f -w better-sqlite3

      - name: E2E test (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a npx turbo test:e2e

      - name: E2E test (non-Linux)
        if: runner.os != 'Linux'
        continue-on-error: true
        run: npx turbo test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            packages/saika-lane/playwright-report/
            packages/saika-lane/test-results/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            packages/saika-lane/test-results/vitest-junit.xml
            packages/saika-lane/test-results/playwright-junit.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Bundle size check
        run: npx turbo size-limit

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5
        with:
          directory: packages/saika-lane/coverage
          flags: saika-lane
          token: ${{ secrets.CODECOV_TOKEN }}

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    needs: [changes, lint, build-and-test]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Fail if change detection did not succeed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Succeed for docs-only PRs
        if: needs.changes.outputs.ci != 'true'
        run: echo "docs-only change; heavy CI skipped"
      - name: Fail unless CI jobs succeeded
        if: |
          needs.changes.outputs.ci == 'true' &&
          (needs.lint.result != 'success' || needs.build-and-test.result != 'success')
        run: exit 1
      - name: Mark success
        if: needs.changes.outputs.ci == 'true' && needs.lint.result == 'success' && needs.build-and-test.result == 'success'
        run: echo "CI passed"
