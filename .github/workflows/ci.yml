name: CI

on:
  push:
    branches: [1.x]
  pull_request:
    branches: [1.x, canary]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      text: ${{ steps.plan.outputs.text }}
      infrastructure: ${{ steps.plan.outputs.infrastructure }}
      ci: ${{ steps.plan.outputs.ci }}
      build: ${{ steps.plan.outputs.build }}
      docs: ${{ steps.plan.outputs.docs }}
      electron: ${{ steps.plan.outputs.electron }}
      packages: ${{ steps.plan.outputs.packages }}
      os: ${{ steps.plan.outputs.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify CI selection and gate behavior
        run: node --test scripts/select-ci-packages.test.mjs scripts/run-package-ci.test.mjs scripts/check-required-ci.test.mjs
      - name: Select affected packages and runners
        id: plan
        run: node scripts/select-ci-packages.mjs

  text:
    name: Text lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.text == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup-node
      - name: Verify text spacing rules
        run: npm run test:text
      - name: Verify release checks
        run: npm run test:pre-release
      - name: Verify dependency update policy
        run: node --test scripts/dependabot-policy.test.mjs
      - name: Lint documentation
        run: npm run lint:text

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Lint workflows, shell scripts, Dockerfiles, and Actions security
        run: node scripts/lint-infra.mjs

  lint:
    env:
      CI_PACKAGES_JSON: ${{ needs.changes.outputs.packages }}
    name: Lint & Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "true"

      - name: Type check
        run: npm run ci:packages -- typecheck

      - name: Test changed-code coverage gate
        run: node --test scripts/coverage-diff-check.test.mjs

      - name: Lint
        run: npm run ci:packages -- lint

      - name: Architecture validation
        run: npm run ci:packages -- depcruise

      # Validates dependency license compatibility against allowed SPDX list
      # in .licensee.json. Does not perform deep transitive-dependency analysis
      # beyond what npm installs (i.e., optional/peer deps not installed are not checked).
      - name: License check
        run: npm run license-check

      - name: Verify third-party license report
        run: npm run license-report:check

      - name: Spell check
        run: npm run cspell

      - name: Unused exports check
        run: npm run ci:packages -- knip

      - name: Dependency version check
        run: npm run syncpack

  build-and-test:
    env:
      CI_PACKAGES_JSON: ${{ needs.changes.outputs.packages }}
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    timeout-minutes: 60
    if: needs.changes.outputs.build == 'true'
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "true"
          enable-electron-cache: "true"

      - name: Build
        run: npm run ci:packages -- build

      - name: Rebuild better-sqlite3 for Node.js tests
        if: needs.changes.outputs.electron == 'true'
        run: npm rebuild better-sqlite3

      - name: Test affected packages
        run: npm run ci:packages -- test

      - name: Require coverage of changed code
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run coverage:diff -- --base "$BASE_SHA" --packages "$CI_PACKAGES_JSON"

      - name: Mutation test affected core libraries
        if: runner.os == 'Linux'
        run: npm run ci:packages -- test:mutation

      - name: Test release metadata
        if: contains(fromJSON(needs.changes.outputs.packages), '@sasakiuri/saika-updater')
        run: npm run test:release-metadata

      - name: Rebuild native modules for Electron (E2E)
        if: needs.changes.outputs.electron == 'true'
        run: npx electron-rebuild -f -w better-sqlite3 --module-dir=.

      - name: Install Nilay About test browsers
        if: contains(fromJSON(needs.changes.outputs.packages), '@sasakiuri/nilay-about')
        run: npm run test:install --workspace=@sasakiuri/nilay-about

      - name: Install Nilay Knowledge test browsers
        if: contains(fromJSON(needs.changes.outputs.packages), '@sasakiuri/nilay-knowledge')
        run: npm run test:install --workspace=@sasakiuri/nilay-knowledge

      - name: E2E tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run ci:packages -- test:e2e

      - name: E2E tests (non-Linux)
        if: runner.os != 'Linux'
        run: npm run ci:packages -- test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            packages/saika-lane/playwright-report/
            packages/saika-lane/test-results/
            packages/saika-director/playwright-report/
            packages/saika-director/test-results/
            packages/saika-vista/playwright-report/
            packages/saika-vista/test-results/
            packages/nilay-about/playwright-report/
            packages/nilay-about/test-results/
            packages/nilay-knowledge/playwright-report/
            packages/nilay-knowledge/test-results/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            packages/saika-lane/test-results/vitest-junit.xml
            packages/saika-lane/test-results/playwright-junit.xml
            packages/saika-director/test-results/vitest-junit.xml
            packages/saika-director/test-results/playwright-junit.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Bundle size check
        run: npm run ci:packages -- size-limit

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && contains(fromJSON(needs.changes.outputs.packages), '@sasakiuri/saika-lane')
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5
        with:
          directory: packages/saika-lane/coverage
          flags: saika-lane
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Saika Director coverage
        if: matrix.os == 'ubuntu-latest' && contains(fromJSON(needs.changes.outputs.packages), '@sasakiuri/saika-director')
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5
        with:
          directory: packages/saika-director/coverage
          flags: saika-director
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    permissions:
      contents: read

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    needs: [changes, text, infrastructure, lint, build-and-test, docs]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Verify gate behavior
        run: node --test scripts/check-required-ci.test.mjs
      - name: Require successful applicable checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/check-required-ci.mjs
