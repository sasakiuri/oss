name: CI

on:
  push:
    branches: [1.x]
  pull_request:
    branches: [1.x, canary]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      docs: ${{ steps.docs-filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # paths-filter needs full history for push-event diff computation
          # (shallow clones miss the base commit when several commits are
          # pushed together). PR events use base.sha so depth is irrelevant.
          fetch-depth: 0
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: "every"
          filters: |
            ci:
              - '**'
              - '!**.md'
              - '!docs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/DISCUSSION_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
              - '!.github/SUPPORT.md'
              - '!.github/FUNDING.yml'
              - '!.github/labels.yml'
              - '!LICENSE'
              - '!.editorconfig'
      - name: Filter documentation and shared configuration
        id: docs-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - 'packages/saika-docs/**'
              - 'packages/*-config/**'
              - '*.json'
              - '.npmrc'
              - '.editorconfig'
              - '.github/actions/setup-node/**'
              - '*config*'
              - '.syncpackrc.json'
              - '.licensee.json'
              - '.github/workflows/{ci,docs*}.yml'
              - 'scripts/**'
              - 'docker/**'
              - '.dockerignore'
              - '.devcontainer/**'
              - 'compose*.yaml'
              - 'Makefile'

  text:
    name: Text lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup environment
        uses: ./.github/actions/setup-node
      - name: Verify text spacing rules
        run: npm run test:text
      - name: Verify release checks
        run: npm run test:pre-release
      - name: Lint documentation
        run: npm run lint:text

  lint:
    name: Lint & Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "true"

      - name: Type check
        run: npx turbo typecheck --filter=!@sasakiuri/saika-docs

      - name: Lint
        run: npx turbo lint --filter=!@sasakiuri/saika-docs

      - name: Architecture validation
        run: npx turbo depcruise --filter=!@sasakiuri/saika-docs

      # Validates dependency license compatibility against allowed SPDX list
      # in .licensee.json. Does not perform deep transitive-dependency analysis
      # beyond what npm installs (i.e., optional/peer deps not installed are not checked).
      - name: License check
        run: npm run license-check

      - name: Verify third-party license report
        run: npm run license-report:check

      - name: Spell check
        run: npm run cspell

      - name: Unused exports check
        run: npm run knip

      - name: Dependency version check
        run: npm run syncpack

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "true"
          enable-electron-cache: "true"

      - name: Build
        run: npx turbo build --filter=!@sasakiuri/saika-docs

      - name: Rebuild better-sqlite3 for Node.js tests
        run: npm rebuild better-sqlite3

      - name: Test shared MQTT contracts
        run: npm run test --workspace=@sasakiuri/saika-protocol

      - name: Test application updates and release metadata
        shell: bash
        run: |
          npm run test --workspace=@sasakiuri/saika-updater
          npm run test:release-metadata

      - name: Test Saika Director
        run: npm run test:coverage --workspace=@sasakiuri/saika-director

      - name: Test Saika Vista
        run: npm run test --workspace=@sasakiuri/saika-vista

      - name: Test Saika Lane
        run: cd packages/saika-lane && npx vitest run --coverage

      - name: Rebuild native modules for Electron (E2E)
        run: npx electron-rebuild -f -w better-sqlite3 --module-dir=.

      - name: E2E test Saika Director (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e --workspace=@sasakiuri/saika-director

      - name: E2E test Saika Director (non-Linux)
        if: runner.os != 'Linux'
        run: npm run test:e2e --workspace=@sasakiuri/saika-director

      - name: E2E test Saika Lane (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e --workspace=@sasakiuri/saika-lane

      - name: E2E test Saika Lane (non-Linux)
        if: runner.os != 'Linux'
        run: npm run test:e2e --workspace=@sasakiuri/saika-lane

      - name: E2E test Saika Vista (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e --workspace=@sasakiuri/saika-vista

      - name: E2E test Saika Vista (non-Linux)
        if: runner.os != 'Linux'
        run: npm run test:e2e --workspace=@sasakiuri/saika-vista

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            packages/saika-lane/playwright-report/
            packages/saika-lane/test-results/
            packages/saika-director/playwright-report/
            packages/saika-director/test-results/
            packages/saika-vista/playwright-report/
            packages/saika-vista/test-results/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: |
            packages/saika-lane/test-results/vitest-junit.xml
            packages/saika-lane/test-results/playwright-junit.xml
            packages/saika-director/test-results/vitest-junit.xml
            packages/saika-director/test-results/playwright-junit.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Bundle size check
        run: npx turbo size-limit

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          directory: packages/saika-lane/coverage
          flags: saika-lane
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Saika Director coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          directory: packages/saika-director/coverage
          flags: saika-director
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
    secrets: inherit
    permissions:
      contents: read

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    needs: [changes, text, lint, build-and-test, docs]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Verify gate behavior
        run: node --test scripts/check-required-ci.test.mjs
      - name: Require successful applicable checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/check-required-ci.mjs
