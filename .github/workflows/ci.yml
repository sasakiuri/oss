name: CI

on:
  push:
    branches: [1.x]
  pull_request:
    branches: [1.x]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  approval:
    runs-on: ubuntu-latest
    permissions: {}
    environment: ci-approval
    steps:
      - name: Confirm approval
        run: "true"

  repository:
    needs: approval
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          ignore-install-scripts: "true"
      - name: Verify workflow approval policy
        run: node --test scripts/workflow-approval.test.mjs
      - name: Validate shared tooling
        run: node --test packages/repo-tooling/tests/*.test.mjs packages/eslint-config/tests/*.test.mjs scripts/run-e2e-ci.test.mjs
      - name: Test npm bootstrap and latest-run guard
        run: node --test scripts/npm-runtime.test.mjs scripts/require-latest-run.test.mjs
      - name: Check formatting, styles, and repository documentation
        run: npm run lint:repository
      - name: Check spelling
        run: npm run cspell
      - name: Validate every pull request commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm exec --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  changes:
    needs: approval
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      syncLabels: ${{ steps.plan.outputs.syncLabels }}
      knowledgeLinks: ${{ steps.plan.outputs.knowledgeLinks }}
      text: ${{ steps.plan.outputs.text }}
      infrastructure: ${{ steps.plan.outputs.infrastructure }}
      knip: ${{ steps.plan.outputs.knip }}
      ci: ${{ steps.plan.outputs.ci }}
      build: ${{ steps.plan.outputs.build }}
      docs: ${{ steps.plan.outputs.docs }}
      electron: ${{ steps.plan.outputs.electron }}
      knowledge: ${{ steps.plan.outputs.knowledge }}
      about: ${{ steps.plan.outputs.about }}
      e2e: ${{ steps.plan.outputs.e2e }}
      e2eMatrix: ${{ steps.plan.outputs.e2eMatrix }}
      packages: ${{ steps.plan.outputs.packages }}
      packageMatrix: ${{ steps.plan.outputs.packageMatrix }}
      os: ${{ steps.plan.outputs.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify CI selection and gate behavior
        run: node --test scripts/select-ci-packages.test.mjs scripts/run-package-ci.test.mjs scripts/check-required-ci.test.mjs scripts/install-ci-dependencies.test.mjs scripts/install-windows-browser-deps.test.mjs
      - name: Select affected packages and runners
        id: plan
        run: node scripts/select-ci-packages.mjs

  text:
    name: Text lint
    runs-on: ubuntu-latest
    needs: [approval, changes]
    if: needs.changes.outputs.text == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup-node
      - name: Verify text spacing rules
        run: npm run test:text
      - name: Verify release checks
        run: npm run test:pre-release
      - name: Verify dependency update policy
        run: node --test scripts/dependabot-policy.test.mjs
      - name: Lint documentation
        run: npm run lint:text

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [approval, changes]
    if: needs.changes.outputs.infrastructure == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Lint workflows, shell scripts, Dockerfiles, and Actions security
        run: node scripts/lint-infra.mjs

  knip:
    name: Repository unused-code check
    runs-on: ubuntu-latest
    needs: [approval, changes]
    if: needs.changes.outputs.knip == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
          cache: npm
      - uses: ./.github/actions/setup-npm
      - run: npm ci --ignore-scripts
      - run: npm run knip

  lint:
    env:
      CI_PACKAGES_JSON: ${{ needs.changes.outputs.packages }}
    name: Lint & Checks
    runs-on: ubuntu-latest
    needs: [approval, changes]
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.knowledge == 'true' || needs.changes.outputs.about == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "true"

      - name: Type check
        run: npm run ci:packages -- typecheck

      - name: Test changed-code coverage gate
        run: node --test scripts/coverage-diff-check.test.mjs

      - name: Test dependency security regressions
        run: node --test scripts/dependency-security.test.mjs

      - name: Check dependency tree
        run: |
          node --test scripts/check-dependency-tree.test.mjs
          npm run dependency-tree:check

      - name: Lint
        run: npm run ci:packages -- lint

      - name: Architecture validation
        run: npm run ci:packages -- depcruise

      # Validates dependency license compatibility against allowed SPDX list
      # in .licensee.json. Does not perform deep transitive-dependency analysis
      # beyond what npm installs (i.e., optional/peer deps not installed are not checked).
      - name: License check
        run: npm run license-check

      - name: Verify third-party license report
        run: npm run license-report:check

      - name: Unused exports check
        if: needs.changes.outputs.knip != 'true'
        run: npm run ci:packages -- knip

      - name: Dependency version check
        run: npm run syncpack

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [approval, changes]
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI_PACKAGES_JSON: ${{ toJSON(matrix.packages) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.packageMatrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "true"
          enable-electron-cache: "true"
      - name: Build affected packages
        run: npm run ci:packages -- build
      - name: Archive build outputs with their permissions
        shell: bash
        run: |
          shopt -s nullglob
          outputs=(packages/*/dist packages/*/build packages/*/.next packages/*/lib/generated packages/*/public/feed.xml packages/*/public/sitemap.xml packages/*/public/content-styles)
          # An empty file list also supports workspaces with type-check-only builds.
          touch build-output-files.txt
          tar -cf build-output.tar --exclude='*/.next/cache' --exclude='*/.next/standalone' --exclude='*/.next/dev' -T build-output-files.txt "${outputs[@]}"
      - name: Share build outputs with independent checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.os }}
          path: build-output.tar
          compression-level: 1
          if-no-files-found: error
          retention-days: 1
      - name: Bundle size check
        run: npm run ci:packages -- size-limit

  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [approval, changes, build]
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI_PACKAGES_JSON: ${{ toJSON(matrix.packages) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.packageMatrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          enable-electron-cache: "true"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-${{ matrix.os }}
      - name: Restore build outputs
        shell: bash
        run: tar -xf build-output.tar
      - name: Rebuild better-sqlite3 for Node.js tests
        if: needs.changes.outputs.electron == 'true'
        run: npm rebuild better-sqlite3
      - name: Test with coverage (Linux)
        if: runner.os == 'Linux'
        run: npm run ci:packages -- test
      - name: Test without duplicate coverage (other platforms)
        if: runner.os != 'Linux'
        run: npm run ci:packages -- test --without-coverage
      - name: Require coverage of changed code
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run coverage:diff -- --base "$BASE_SHA" --packages "$CI_PACKAGES_JSON"
      - name: Mutation test affected core libraries
        if: runner.os == 'Linux'
        run: npm run ci:packages -- test:mutation
      - name: Test release metadata
        if: contains(fromJSON(needs.changes.outputs.packages), '@sasakiuri/saika-updater')
        run: npm run test:release-metadata
      - name: Upload unit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            packages/*/coverage/
            packages/*/test-results/vitest-junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Saika Lane coverage
        if: runner.os == 'Linux' && contains(fromJSON(needs.changes.outputs.packages), '@sasakiuri/saika-lane')
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5
        with:
          directory: packages/saika-lane/coverage
          flags: saika-lane
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload Saika Director coverage
        if: runner.os == 'Linux' && contains(fromJSON(needs.changes.outputs.packages), '@sasakiuri/saika-director')
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5
        with:
          directory: packages/saika-director/coverage
          flags: saika-director
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E (${{ matrix.os }}, group ${{ strategy.job-index }})
    runs-on: ${{ matrix.os }}
    needs: [approval, changes, build]
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.e2eMatrix) }}
    env:
      CI_E2E_SUITES_JSON: ${{ toJSON(matrix.suites) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          enable-electron-cache: ${{ matrix.electron && 'true' || 'false' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-${{ matrix.os }}
      - name: Restore build outputs
        shell: bash
        run: tar -xf build-output.tar
      # npm ci has already rebuilt native modules for Electron in this fresh job.
      - name: Install browser dependencies
        if: matrix.suites[0].installBrowsers
        shell: bash
        env:
          E2E_PACKAGE: ${{ matrix.suites[0].package }}
        run: npm run test:install --workspace="$E2E_PACKAGE"
      - name: E2E tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bash scripts/run-e2e-ci.sh
      - name: E2E tests (other platforms)
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/run-e2e-ci.sh
      - name: Upload Playwright reports (suite 1)
        if: always() && matrix.suites[0].package != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-${{ matrix.suites[0].suite }}-${{ matrix.os }}
          path: |
            ${{ matrix.suites[0].directory }}/playwright-report/
            ${{ matrix.suites[0].directory }}/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright reports (suite 2)
        if: always() && matrix.suites[1].package != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-${{ matrix.suites[1].suite }}-${{ matrix.os }}
          path: |
            ${{ matrix.suites[1].directory }}/playwright-report/
            ${{ matrix.suites[1].directory }}/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright reports (suite 3)
        if: always() && matrix.suites[2].package != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-${{ matrix.suites[2].suite }}-${{ matrix.os }}
          path: |
            ${{ matrix.suites[2].directory }}/playwright-report/
            ${{ matrix.suites[2].directory }}/test-results/
          if-no-files-found: ignore
          retention-days: 7

  knowledge:
    needs: [approval, changes]
    if: needs.changes.outputs.knowledge == 'true'
    uses: ./.github/workflows/web-ci.yml
    with:
      application: nilay-knowledge
    permissions:
      contents: read

  about:
    needs: [approval, changes]
    if: needs.changes.outputs.about == 'true'
    uses: ./.github/workflows/web-ci.yml
    with:
      application: nilay-about
    permissions:
      contents: read

  knowledge-required:
    name: Knowledge CI Required
    runs-on: ubuntu-latest
    needs: [approval, changes, knowledge]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Require owner approval
        env:
          APPROVAL_RESULT: ${{ needs.approval.result }}
        shell: bash
        run: test "$APPROVAL_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Require successful Knowledge checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/check-required-ci.mjs knowledge

  about-required:
    name: About CI Required
    runs-on: ubuntu-latest
    needs: [approval, changes, about]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Require owner approval
        env:
          APPROVAL_RESULT: ${{ needs.approval.result }}
        shell: bash
        run: test "$APPROVAL_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Require successful About checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/check-required-ci.mjs about

  docs:
    needs: [approval, changes]
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    permissions:
      contents: read

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    needs:
      [
        approval,
        analyze,
        gitleaks,
        dependency-review,
        validate,
        changes,
        repository,
        text,
        infrastructure,
        knip,
        lint,
        build,
        unit,
        e2e,
        knowledge,
        about,
        knowledge-required,
        about-required,
        docs,
      ]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Require owner approval
        env:
          APPROVAL_RESULT: ${{ needs.approval.result }}
        shell: bash
        run: test "$APPROVAL_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Verify gate behavior
        run: node --test scripts/check-required-ci.test.mjs
      - name: Require successful applicable checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.base_ref }}
          CI_REF: ${{ github.ref }}
        run: node scripts/check-required-ci.mjs

  analyze:
    needs: approval
    permissions:
      security-events: write
      contents: read
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/codeql
        with:
          language: ${{ matrix.language }}
          category: /language:${{ matrix.language }}

  gitleaks:
    needs: approval
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF results
        if: always() && steps.gitleaks.outputs.report != ''
        uses: github/codeql-action/upload-sarif@480db559a14342288b67e54bd959dd52dc3ee68f # v3
        with:
          sarif_file: ${{ steps.gitleaks.outputs.report }}

  # PR-only jobs may skip on pushes to 1.x, which attach checks to mainline SHAs.
  # Manual-run checks do not satisfy PR required checks.
  dependency-review:
    needs: approval
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
          cache: npm
      - uses: ./.github/actions/setup-npm
      - run: npm ci --ignore-scripts
      - name: Audit actual package identities and test security guards
        run: |
          npm audit --audit-level=high
          node --test scripts/dependency-security.test.mjs scripts/dependency-review-aliases.test.mjs

      - name: Verify exact artifacts behind GitHub alias findings
        id: aliases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .local
          gh api "repos/$GH_REPO/dependency-graph/compare/$BASE_SHA...$HEAD_SHA" > .local/dependency-review.json
          node scripts/dependency-review-aliases.mjs .local/dependency-review.json

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
          allow-ghsas: ${{ steps.aliases.outputs.allow-ghsas }}

  validate:
    needs: approval
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # The target branch's own policy; a branch of this repository is trusted.
          ref: ${{ github.base_ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install upstream package manager
        uses: ./.github/actions/setup-npm
      - run: npm ci --ignore-scripts
      - name: Validate title with shared commitlint policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --method GET "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.title' | npm exec --no -- commitlint --verbose

  osv-scan-push:
    needs: approval
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/1.x')
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b8ac13f90f0ad78cebdcdbe5d39fcc8ff11301ba # v2
    with:
      scan-args: |-
        --recursive
        ./

  osv-scan-pr:
    needs: approval
    if: github.event_name == 'pull_request' && github.base_ref == '1.x'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2

  # Same-repository PR definitions are trusted after owner approval.
  # Fork PR tokens are read-only; this write job never runs for forks.
  label:
    needs: approval
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          configuration-path: .github/labeler.yml

  dependabot:
    needs: approval
    if: github.event_name == 'pull_request' && github.base_ref == '1.x' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide auto-merge policy
        id: policy
        shell: bash
        env:
          GROUP: ${{ steps.metadata.outputs.dependency-group }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          AUTO_MERGE=false
          # Production dependencies and all major updates require review.
          if [[ "$UPDATE_TYPE" == 'version-update:semver-minor' || "$UPDATE_TYPE" == 'version-update:semver-patch' ]]; then
            if [[ "$ECOSYSTEM" == 'npm_and_yarn' && ( "$GROUP" == 'npm-development' || "$GROUP" == 'security-dev-safe' ) ]]; then
              AUTO_MERGE=true
            elif [[ "$ECOSYSTEM" == 'github_actions' && "$GROUP" == 'actions-compatible' ]]; then
              AUTO_MERGE=true
            fi
          fi
          echo "auto-merge=$AUTO_MERGE" >> "$GITHUB_OUTPUT"

      - name: Approve PR
        if: steps.policy.outputs.auto-merge == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.policy.outputs.auto-merge == 'true'
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-labels:
    needs: [approval, changes]
    if: needs.changes.outputs.syncLabels == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/1.x'))
    uses: ./.github/workflows/sync-labels.yml
    permissions:
      contents: read
      issues: write

  knowledge-links:
    needs: [approval, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.knowledgeLinks == 'true'
    uses: ./.github/workflows/knowledge-links.yml
    permissions:
      contents: read

  # Same-repository PR definitions are trusted after owner approval.
  # Fork PR tokens are read-only; this write job never runs for forks.
  report:
    needs:
      [
        approval,
        repository,
        changes,
        text,
        infrastructure,
        knip,
        lint,
        build,
        unit,
        e2e,
        knowledge,
        about,
        knowledge-required,
        about-required,
        docs,
        ci-required,
        analyze,
        gitleaks,
        dependency-review,
        validate,
        osv-scan-push,
        osv-scan-pr,
        label,
        dependabot,
        sync-labels,
        knowledge-links,
      ]
    permissions:
      contents: read
      checks: write
      actions: read
    if: ${{ !cancelled() && needs.approval.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest

    steps:
      # The reporter discovers artifacts from this CI run after all producers finish.
      # Captured OS names keep separate reports without starting three runners.
      - name: Vitest test report
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2
        with:
          artifact: /^test-results-(ubuntu-latest|windows-latest|macos-latest)$/
          name: "Vitest ($1)"
          path: "**/vitest-junit.xml"
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Playwright test report
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2
        with:
          artifact: /^playwright-(\d+)-(ubuntu-latest|windows-latest|macos-latest)$/
          name: "Playwright ($2, suite $1)"
          path: "**/playwright-junit.xml"
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
