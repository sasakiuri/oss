# Temporary diagnostic workflow; this branch is closed without merging.
name: Nilay News regression workspace

on:
  pull_request:
    branches: [1.x]
    paths:
      - .github/workflows/nilay-news-workspace-bootstrap.yml

permissions:
  contents: read

concurrency:
  group: nilay-news-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/nilay-news/regression-workspace-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
      - name: Install browser dependencies already pinned by the repository lockfile
        run: |
          npm install --global npm@11.13.0
          npm ci --ignore-scripts --workspace @sasakiuri/nilay-knowledge --include-workspace-root
      - name: Package only the browser test runner
        run: |
          tar -czf nilay-news-browser-dependencies.tar.gz node_modules/@playwright/test node_modules/playwright node_modules/playwright-core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nilay-news-browser-dependencies
          path: nilay-news-browser-dependencies.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
