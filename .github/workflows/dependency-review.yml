name: Dependency Review

on:
  pull_request:
    branches: [1.x]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
          cache: npm
      - run: npm install --global npm@11.20.0 # zizmor: ignore[adhoc-packages]
      - run: npm ci --ignore-scripts
      - name: Audit actual package identities and test security guards
        run: |
          npm audit --audit-level=high
          node --test scripts/dependency-security.test.mjs scripts/dependency-review-aliases.test.mjs

      - name: Verify exact artifacts behind GitHub alias findings
        id: aliases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .local
          gh api "repos/$GH_REPO/dependency-graph/compare/$BASE_SHA...$HEAD_SHA" > .local/dependency-review.json
          node scripts/dependency-review-aliases.mjs .local/dependency-review.json

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
          allow-ghsas: ${{ steps.aliases.outputs.allow-ghsas }}
