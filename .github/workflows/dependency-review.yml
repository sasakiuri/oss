name: Dependency Review

on:
  pull_request:
    branches: [1.x]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d7 # v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
