name: Scheduled workflow failure alert

on:
  # Only run trusted 1.x alert code; never consume triggering code or artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - CI
      - CodeQL
      - Docs deep quality
      - Docs static site monitoring
      - Knowledge content links
      - Lock Threads
      - Scorecard
      - Security
      - Stale Issues
    types: [completed]
    branches: [1.x]

permissions: {}

jobs:
  approval:
    runs-on: ubuntu-latest
    permissions: {}
    environment: ci-approval
    steps:
      - name: Confirm approval
        run: "true"

  alert:
    needs: approval
    if: github.event.workflow_run.event == 'schedule'
    # Job-level, so completions of push and pull request runs never enter the
    # group and replace a pending scheduled result.
    concurrency:
      group: scheduled-failure-alert-${{ github.event.workflow_run.workflow_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: 1.x
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
      - name: Update scheduled workflow issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: node scripts/scheduled-failure-alert.mjs
