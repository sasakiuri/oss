name: Labeler

on:
  # Approval runs no repository code; the label action uses trusted base configuration.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened]

# Only the workload inherits these permissions; approval explicitly grants none.
permissions:
  contents: read
  pull-requests: write # zizmor: ignore[excessive-permissions]

jobs:
  approval:
    runs-on: ubuntu-latest
    permissions: {}
    environment: ci-approval
    steps:
      - name: Confirm approval
        run: "true"

  label:
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          configuration-path: .github/labeler.yml
