name: Dependabot Auto-merge

on:
  pull_request:
    branches:
      - 1.x
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide auto-merge policy
        id: policy
        shell: bash
        env:
          GROUP: ${{ steps.metadata.outputs.dependency-group }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          AUTO_MERGE=false
          # Production dependencies and all major updates require review.
          if [[ "$UPDATE_TYPE" == 'version-update:semver-minor' || "$UPDATE_TYPE" == 'version-update:semver-patch' ]]; then
            if [[ "$ECOSYSTEM" == 'npm_and_yarn' && ( "$GROUP" == 'npm-development' || "$GROUP" == 'security-dev-safe' ) ]]; then
              AUTO_MERGE=true
            elif [[ "$ECOSYSTEM" == 'github_actions' && "$GROUP" == 'actions-compatible' ]]; then
              AUTO_MERGE=true
            fi
          fi
          echo "auto-merge=$AUTO_MERGE" >> "$GITHUB_OUTPUT"

      - name: Approve PR
        if: steps.policy.outputs.auto-merge == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.policy.outputs.auto-merge == 'true'
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
