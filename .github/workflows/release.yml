name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          enable-turbo-cache: "true"
          enable-electron-cache: "true"

      - name: Verify tag matches Saika suite versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          lane_version=$(node -p "require('./packages/saika-lane/package.json').version")
          director_version=$(node -p "require('./packages/saika-director/package.json').version")
          docs_version=$(node -p "require('./packages/saika-docs/package.json').version")
          vista_version=$(node -p "require('./packages/saika-vista/package.json').version")
          if [ "$lane_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Saika Lane version $lane_version"
            exit 1
          fi
          if [ "$director_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Saika Director version $director_version"
            exit 1
          fi
          if [ "$vista_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Saika Vista version $vista_version"
            exit 1
          fi
          if [ "$docs_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Saika Docs version $docs_version"
            exit 1
          fi
        shell: bash

      - name: Rebuild better-sqlite3 for Node.js tests
        run: npm rebuild better-sqlite3

      - name: Type check
        run: npx turbo typecheck

      - name: Lint
        run: npx turbo lint

      - name: Unit tests and coverage thresholds
        run: |
          npm run test --workspace=@sasakiuri/saika-updater
          npm run test:release-metadata
          npm run test:coverage --workspace=@sasakiuri/saika-lane
          npm run test:coverage --workspace=@sasakiuri/saika-director
          npm run test --workspace=@sasakiuri/saika-vista

      - name: Architecture validation
        run: npx turbo depcruise

      - name: Build
        run: npx turbo build

      - name: Bundle size
        run: npx turbo size-limit

      - name: License checks
        run: |
          npm run license-check
          npm run license-report:check

      - name: Repository consistency checks
        run: |
          npm run knip
          npm run syncpack
          npm run cspell

      - name: Rebuild better-sqlite3 for Electron E2E
        run: npx electron-rebuild -f -w better-sqlite3 --module-dir=.

      - name: Electron E2E
        run: |
          xvfb-run -a npm run test:e2e --workspace=@sasakiuri/saika-lane
          xvfb-run -a npm run test:e2e --workspace=@sasakiuri/saika-director
          xvfb-run -a npm run test:e2e --workspace=@sasakiuri/saika-vista

      - name: Restore better-sqlite3 for Node.js
        if: always()
        run: npm rebuild better-sqlite3

  build:
    name: Build (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          enable-electron-cache: "true"

      - name: Build Saika Lane artifacts
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK; fi
          npm run build:${{ matrix.platform }} --workspace=@sasakiuri/saika-lane
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}

      - name: Build Saika Director artifacts
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK; fi
          npm run build:${{ matrix.platform }} --workspace=@sasakiuri/saika-director
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}

      - name: Build Saika Vista artifacts
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK; fi
          npm run build:${{ matrix.platform }} --workspace=@sasakiuri/saika-vista
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}

      - name: Verify packaged legal notices
        shell: bash
        run: |
          npm run license-artifacts:check --workspace=@sasakiuri/saika-lane
          npm run license-artifacts:check --workspace=@sasakiuri/saika-director
          npm run license-artifacts:check --workspace=@sasakiuri/saika-vista

      - name: Validate artifact inventories
        run: |
          validate_artifacts() {
            local application="$1"
            local directory="$2"
            pushd "$directory" >/dev/null
            shopt -s nullglob
            artifacts=(*.exe *.zip *.dmg *.AppImage *.deb)
            if [ ${#artifacts[@]} -eq 0 ]; then
              echo "::error::No $application artifacts found"
              exit 1
            fi
            minimum_size=$((10 * 1024 * 1024))
            for artifact in "${artifacts[@]}"; do
              size=$(stat -f%z "$artifact" 2>/dev/null || stat -c%s "$artifact" 2>/dev/null)
              if [ -z "$size" ] || [ "$size" -lt "$minimum_size" ]; then
                echo "::error::$application artifact $artifact is missing or suspiciously small (${size:-unknown} bytes)"
                exit 1
              fi
              echo "OK $application: $artifact (${size} bytes)"
            done
            popd >/dev/null
          }

          validate_artifacts "Saika Lane" packages/saika-lane/release
          validate_artifacts "Saika Director" packages/saika-director/release
          validate_artifacts "Saika Vista" packages/saika-vista/release
        shell: bash

      - name: Install AppImage runtime dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && (sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2)

      - name: Smoke test AppImage launches
        if: runner.os == 'Linux'
        run: |
          smoke_test_appimage() {
            local application="$1"
            local directory="$2"
            pushd "$directory" >/dev/null
            shopt -s nullglob
            appimages=(*.AppImage)
            if [ ${#appimages[@]} -ne 1 ]; then
              echo "::error::Expected exactly one $application AppImage, found ${#appimages[@]}"
              exit 1
            fi
            chmod +x "${appimages[0]}"
            xvfb-run -a ./"${appimages[0]}" --no-sandbox &
            app_pid=$!
            sleep 8
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::$application AppImage failed to stay running"
              exit 1
            fi
            kill "$app_pid"
            wait "$app_pid" 2>/dev/null || true
            popd >/dev/null
          }

          smoke_test_appimage "Saika Lane" packages/saika-lane/release
          smoke_test_appimage "Saika Director" packages/saika-director/release
          smoke_test_appimage "Saika Vista" packages/saika-vista/release
        shell: bash

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packages/saika-lane/release/*.exe
            packages/saika-lane/release/*.zip
            packages/saika-lane/release/*.dmg
            packages/saika-lane/release/*.AppImage
            packages/saika-lane/release/*.deb
            packages/saika-director/release/*.exe
            packages/saika-director/release/*.zip
            packages/saika-director/release/*.dmg
            packages/saika-director/release/*.AppImage
            packages/saika-director/release/*.deb
            packages/saika-vista/release/*.exe
            packages/saika-vista/release/*.zip
            packages/saika-vista/release/*.dmg
            packages/saika-vista/release/*.AppImage
            packages/saika-vista/release/*.deb

      - name: Upload Saika Lane build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-lane-${{ matrix.os }}
          path: |
            packages/saika-lane/release/*.exe
            packages/saika-lane/release/*.zip
            packages/saika-lane/release/*.dmg
            packages/saika-lane/release/*.AppImage
            packages/saika-lane/release/*.deb
            packages/saika-lane/release/latest*.yml
            packages/saika-lane/release/alpha*.yml
            packages/saika-lane/release/beta*.yml
            packages/saika-lane/release/rc*.yml
            packages/saika-lane/release/*.blockmap
          if-no-files-found: error
          retention-days: 1

      - name: Upload Saika Director build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-director-${{ matrix.os }}
          path: |
            packages/saika-director/release/*.exe
            packages/saika-director/release/*.zip
            packages/saika-director/release/*.dmg
            packages/saika-director/release/*.AppImage
            packages/saika-director/release/*.deb
            packages/saika-director/release/director-*.yml
            packages/saika-director/release/*.blockmap
          if-no-files-found: error
          retention-days: 1

      - name: Upload Saika Vista build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-vista-${{ matrix.os }}
          path: |
            packages/saika-vista/release/*.exe
            packages/saika-vista/release/*.zip
            packages/saika-vista/release/*.dmg
            packages/saika-vista/release/*.AppImage
            packages/saika-vista/release/*.deb
            packages/saika-vista/release/vista-*.yml
            packages/saika-vista/release/*.blockmap
          if-no-files-found: error
          retention-days: 1

  create-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download Saika Lane artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/lane
          pattern: release-lane-*
          merge-multiple: true

      - name: Download Saika Director artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/director
          pattern: release-director-*
          merge-multiple: true

      - name: Download Saika Vista artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/vista
          pattern: release-vista-*
          merge-multiple: true

      - name: Restore execute permissions on AppImages
        run: chmod +x artifacts/lane/*.AppImage artifacts/director/*.AppImage artifacts/vista/*.AppImage 2>/dev/null || true
        shell: bash

      - name: Generate checksums
        run: |
          {
            (
              cd artifacts/lane
              shopt -s nullglob
              files=(*.exe *.zip *.dmg *.AppImage *.deb)
              if [ ${#files[@]} -eq 0 ]; then
                echo "No Saika Lane release artifacts found" >&2
                exit 1
              fi
              sha256sum "${files[@]}"
            )
            (
              cd artifacts/director
              shopt -s nullglob
              files=(*.exe *.zip *.dmg *.AppImage *.deb)
              if [ ${#files[@]} -eq 0 ]; then
                echo "No Saika Director release artifacts found" >&2
                exit 1
              fi
              sha256sum "${files[@]}"
            )
            (
              cd artifacts/vista
              shopt -s nullglob
              files=(*.exe *.zip *.dmg *.AppImage *.deb)
              if [ ${#files[@]} -eq 0 ]; then
                echo "No Saika Vista release artifacts found" >&2
                exit 1
              fi
              sha256sum "${files[@]}"
            )
          } > artifacts/SHA256SUMS.txt
        shell: bash

      - name: Attest checksums provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            artifacts/lane/*.exe
            artifacts/lane/*.zip
            artifacts/lane/*.dmg
            artifacts/lane/*.AppImage
            artifacts/lane/*.deb
            artifacts/lane/latest*.yml
            artifacts/lane/alpha*.yml
            artifacts/lane/beta*.yml
            artifacts/lane/rc*.yml
            artifacts/lane/*.blockmap
            artifacts/director/*.exe
            artifacts/vista/*.exe
            artifacts/director/*.zip
            artifacts/vista/*.zip
            artifacts/director/*.dmg
            artifacts/vista/*.dmg
            artifacts/director/*.AppImage
            artifacts/vista/*.AppImage
            artifacts/director/*.deb
            artifacts/vista/*.deb
            artifacts/director/director-*.yml
            artifacts/director/*.blockmap
            artifacts/vista/vista-*.yml
            artifacts/vista/*.blockmap
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
