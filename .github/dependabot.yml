version: 2

updates:
  # ── Root npm dependencies ──────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "02:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - "Cat: Dependencies 🤖"
    commit-message:
      prefix: "chore(root):"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      major-updates:
        applies-to: version-updates
        update-types:
          - major
      security-prod-safe:
        applies-to: security-updates
        dependency-type: production
        update-types:
          - patch
          - minor
      security-dev-safe:
        applies-to: security-updates
        dependency-type: development
        update-types:
          - patch
          - minor
      security-prod-major:
        applies-to: security-updates
        dependency-type: production
        update-types:
          - major
      security-dev-major:
        applies-to: security-updates
        dependency-type: development
        update-types:
          - major

