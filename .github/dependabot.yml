# npm workspaces share the root lockfile; update their manifests together.
# Version updates wait seven days; security updates bypass cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - "Cat: Dependencies 🤖"
    commit-message:
      prefix: "chore(root):"
    groups:
      npm-development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      major-updates:
        applies-to: version-updates
        update-types:
          - major
      security-prod-safe:
        applies-to: security-updates
        dependency-type: production
        update-types:
          - patch
          - minor
      security-dev-safe:
        applies-to: security-updates
        dependency-type: development
        update-types:
          - patch
          - minor
      security-prod-major:
        applies-to: security-updates
        dependency-type: production
        update-types:
          - major
      security-dev-major:
        applies-to: security-updates
        dependency-type: development
        update-types:
          - major
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - "Cat: Dependencies 🤖"
    commit-message:
      prefix: "chore(root):"
    # Major action updates stay ungrouped so one failing update cannot block the others.
    groups:
      actions-compatible:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directories:
      - /docker/docs
      - /docker/pdf
      - /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /docker/pdf
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - "Cat: Dependencies 🤖"
    commit-message:
      prefix: "chore(root):"
    cooldown:
      default-days: 7
