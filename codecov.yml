coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 80%

comment:
  layout: "reach,diff,flags,components"
  behavior: default
  require_changes: true

ignore:
  - "packages/eslint-config/**"
  - "packages/prettier-config/**"
  - "packages/stylelint-config/**"
  - "packages/typescript-config/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/tests/**"
