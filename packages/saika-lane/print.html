<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP: style-src 'unsafe-inline' is required because Tailwind CSS injects inline styles
      at runtime (e.g., arbitrary values, dynamic class utilities). Removing it would break styling.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <title>Score Sheet</title>
  </head>
  <body>
    <div id="print-root"></div>
    <script type="module" src="/src/renderer/print.tsx"></script>
  </body>
</html>
