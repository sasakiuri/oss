version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Asia/Tokyo"
    assignees:
      - "sasaki264"
    commit-message:
      prefix: "npm"
    labels:
      - "npm"
      - "dependencies"
    reviewers:
      - "sasaki264"
    target-branch: "master"