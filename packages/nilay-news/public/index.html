<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="狩猟・鳥獣・射撃のニュースを集め、選んで投稿するための受信箱。"
    />
    <title>Nilay News</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="メインナビゲーション">
        <a class="brand" href="/" aria-label="Nilay News ホーム">
          <span class="brand-copy"
            ><strong>Nilay News</strong><span>狩猟・鳥獣・射撃</span></span
          >
        </a>
        <nav id="navigation" aria-label="記事の一覧"></nav>
        <div class="sidebar-bottom">
          <div class="publication-status">
            <span class="status-dot" aria-hidden="true"></span
            ><span>X 自動投稿</span
            ><strong id="sidebar-posting-status">確認中</strong>
          </div>
          <button class="nav-item settings-nav" id="settings-nav" type="button">
            <span class="ui-icon icon-settings" aria-hidden="true"></span
            >収集元と設定
          </button>
        </div>
      </aside>
      <main id="main" class="main" tabindex="-1">
        <header class="page-header">
          <div>
            <div class="page-heading">
              <h1 id="page-title" tabindex="-1">受信箱</h1>
              <span id="list-count" class="count-label"></span>
            </div>
            <p id="page-description" class="page-description">
              新着記事を確認します。
            </p>
          </div>
          <div class="header-actions">
            <button
              class="button button-subtle"
              id="analyze-button"
              type="button"
            >
              未判定を仕分け</button
            ><button
              class="button button-primary"
              id="collect-button"
              type="button"
            >
              <span class="ui-icon icon-refresh" aria-hidden="true"></span
              ><span id="collect-label">記事を集める</span>
            </button>
          </div>
        </header>
        <div id="notice" class="notice" role="status" aria-live="polite" hidden>
          <span id="notice-text"></span
          ><button id="notice-close" type="button" aria-label="通知を閉じる">
            ×
          </button>
        </div>
        <section
          id="collection-warning"
          class="collection-warning"
          aria-label="収集範囲と注意点"
          role="status"
          hidden
        >
          <strong>収集状況</strong>
          <p id="collection-warning-text"></p>
          <button
            id="collection-warning-details"
            class="text-button"
            type="button"
          >
            詳細を確認
          </button>
        </section>
        <section
          class="job-banner"
          id="job-banner"
          aria-label="処理の進行状況"
          hidden
        >
          <div>
            <span class="spinner" aria-hidden="true"></span
            ><strong id="job-label">収集中</strong><span id="job-count"></span>
          </div>
          <progress id="job-progress" aria-label="処理の進行状況"></progress>
        </section>
        <section id="inbox-view">
          <div class="inbox-toolbar">
            <div class="search-toolbar">
              <label class="search-field"
                ><span class="ui-icon icon-search" aria-hidden="true"></span
                ><span class="sr-only">記事を検索</span
                ><input
                  id="search"
                  type="search"
                  placeholder="見出し・本文などを検索"
                  autocomplete="off"
                  aria-controls="article-list"
                /><kbd aria-hidden="true">/</kbd></label
              >
              <button
                id="filter-toggle"
                class="button filter-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="filter-panel"
              >
                <span class="ui-icon icon-filter" aria-hidden="true"></span
                >絞り込み<span
                  id="filter-count"
                  class="filter-count"
                  hidden
                ></span>
              </button>
              <label class="sr-only" for="sort-filter">並び順</label
              ><select id="sort-filter">
                <option value="priority">仕分け順</option>
                <option value="newest" selected>新しい順</option>
              </select>
            </div>
            <div id="filter-panel" class="filters" hidden>
              <label class="filter-field"
                ><span>テーマ</span
                ><select id="topic-filter">
                  <option value="">すべてのテーマ</option>
                </select></label
              ><label class="filter-field"
                ><span>仕分け結果</span
                ><select id="analysis-filter">
                  <option value="">すべての仕分け結果</option>
                  <option value="candidate">候補</option>
                  <option value="review">要確認</option>
                  <option value="irrelevant">対象外</option>
                  <option value="pending">未判定</option>
                  <option value="error">仕分け失敗</option>
                </select></label
              ><label class="filter-field"
                ><span>重複・関連性</span
                ><select id="relation-filter">
                  <option value="">すべての重複・関連性</option>
                  <option value="duplicate">重複の可能性</option>
                  <option value="uncertain">関連性を確認</option>
                  <option value="followup">続報の可能性</option>
                  <option value="different">別の出来事</option>
                  <option value="none">比較なし</option>
                </select></label
              >
            </div>
            <div
              id="active-filters"
              class="active-filters"
              aria-label="適用中の検索条件"
              hidden
            ></div>
          </div>
          <div class="reading-workspace" id="reading-workspace">
            <div class="article-column">
              <div class="list-heading">
                <h2>ニュース一覧</h2>
                <span
                  id="list-range"
                  class="count-label"
                  aria-live="polite"
                ></span>
              </div>
              <div id="bulk-actions" class="bulk-actions" hidden>
                <label class="bulk-select-label">
                  <input id="select-all-articles" type="checkbox" />
                  <span>表示中をすべて選択</span>
                </label>
                <span
                  id="selection-count"
                  class="count-label"
                  role="status"
                ></span>
                <div id="selection-tools" class="selection-tools" hidden>
                  <button
                    id="clear-selection"
                    class="text-button"
                    type="button"
                  >
                    選択を解除
                  </button>
                  <label class="sr-only" for="bulk-operation"
                    >選択した記事の操作</label
                  >
                  <select id="bulk-operation">
                    <option value="dismissed">見送り</option>
                    <option value="approved">投稿を承認</option>
                    <option value="saved">保存</option>
                    <option value="unread">未読に戻す・承認を解除</option>
                  </select>
                  <button
                    id="apply-selected"
                    class="button button-subtle"
                    type="button"
                    disabled
                  >
                    選択した記事を見送る
                  </button>
                </div>
                <p id="bulk-help" class="form-help bulk-help" hidden></p>
              </div>
              <div
                id="article-list"
                class="article-list"
                aria-label="ニュース記事"
                aria-busy="true"
              ></div>
              <div id="list-pagination" class="list-pagination"></div>
              <p class="list-footnote" id="list-footnote" hidden></p>
            </div>
            <aside
              class="detail-panel"
              id="detail-panel"
              aria-label="記事の詳細"
            ></aside>
          </div>
        </section>
        <section
          id="settings-view"
          class="settings-view"
          hidden
          aria-label="収集元と設定"
        ></section>
        <footer class="page-footer">
          <span id="last-updated">読み込み中…</span>
          <p class="time-zone-note">日本時間（JST）・24時間表記</p>
        </footer>
      </main>
    </div>
    <noscript
      ><p class="noscript">
        この受信箱を使うには JavaScript を有効にしてください。
      </p></noscript
    >
  </body>
</html>
